- id: pruefer-01
  kategorie: fach
  frage: 'Karte: Kaufnebenkosten für 2.000.000 € Grundstück in Bayern. Akzeptanzkriterien: (1) Grunderwerbsteuer korrekt, (2) Annahmen-Tabelle, (3) Hinweis Steuerberater. Ergebnis des Bearbeiters: ''Grunderwerbsteuer
    6,5 % = 130.000 €, Notar 2 % = 40.000 €, gesamt 170.000 €.'' Prüfe.'
